    <path d="M17 35h26M30 22v26" stroke="#bcff2f" stroke-width="5" stroke-linecap="round"/>
    <text x="76" y="53" fill="#fff" font-family="Arial Black, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-2">AuraPvP</text>
    <text x="8" y="233" fill="#fff" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">LIVE AURA</text>
    <text x="8" y="307" fill="url(#edge)" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">BATTLES.</text>
